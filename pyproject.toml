[project]
name = "wreckless"
version = "0.1.0"
description = "Always-on local-first agentic SecOps swarm (Purple/Red/Blue) for Dell Pro Max GB10"
requires-python = ">=3.12"
dependencies = ["openai>=1.40", "pytest>=8"]

[project.optional-dependencies]
slack = ["slack-bolt>=1.20"]

[project.scripts]
wreckless = "wreckless.cli:main"

[tool.setuptools.packages.find]
include = ["wreckless*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
